[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-explorer-astra"
version = "0.1.0"
description = "Triagem auditável de orgânicos em semicondutores híbridos, sem IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "gemmi>=0.7,<0.8", "filelock>=3.16,<4"]

[project.optional-dependencies]
pdf = ["pypdf>=5,<8"]
chem = ["rdkit>=2024.3"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
perovskite-explorer = "perovskite_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

